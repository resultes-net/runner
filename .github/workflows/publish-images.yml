name: Create and publish Docker images

on:
  push:
    branches:
      - '*'

jobs:
  build-and-push-base-docker-image:
    runs-on: windows-2019
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
        # See here: https://stackoverflow.com/questions/73854338/cant-install-pip-packages-when-building-a-windows-docker-container
      - name: Fix DNS server for Docker
        shell: cmd
        run: sc config docker binpath="\"C:\Program Files\docker\dockerd.exe\" --run-service --dns 8.8.8.8"

      - name: Build Docker image
        run: |
          docker build -f Dockerfile-prefect -t ghcr.io/spf-ost/resultes-runner-prefect:latest .

      - name: Push Docker image
        id: push
        run: |
          $image_digest=$(py -3.12 push_docker_image_and_get_digest.py ghcr.io/spf-ost/resultes-runner-prefect:latest)
          echo "image_digest=${image_digest}" >> $env:GITHUB_OUTPUT

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/spf-ost/resultes-runner-prefect:latest
          subject-digest: ${{ steps.push.outputs.image_digest }}
          push-to-registry: true
  
  build-and-push-images:
    runs-on: windows-2019
    needs: build-and-push-base-docker-image
    strategy:
      matrix:
        include:
          - dockerfile: ./docker/producer/Dockerfile
            name: resultes-runner-producer
          - dockerfile: ./docker/queue/Dockerfile
            image: resultes-runner-queue
          - dockerfile: ./docker/worker/Dockerfile
            image: resultes-runner-worker
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # See here: https://stackoverflow.com/questions/73854338/cant-install-pip-packages-when-building-a-windows-docker-container
      - name: Fix DNS server for Docker
        shell: cmd
        run: sc config docker binpath="\"C:\Program Files\docker\dockerd.exe\" --run-service --dns 8.8.8.8"

      - name: Build Docker image
        run: |
          docker build -f $ {{ matrix.dockerfile }} -t ghcr.io/spf-ost/${{ matrix.name }}:latest .

      - name: Push Docker image
        id: push
        run: |
          $image_digest=$(py -3.12 push_docker_image_and_get_digest.py ghcr.io/spf-ost/${{ matrix.name }}:latest)
          echo "image_digest=${image_digest}" >> $env:GITHUB_OUTPUT

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/spf-ost/${{ matrix.name }}:latest
          subject-digest: ${{ steps.push.outputs.image_digest }}
          push-to-registry: true
      
