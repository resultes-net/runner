name: Build runner image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    concurrency: build-image-runner_serialized
    
    runs-on: windows-2025
    
    defaults:
      run:
        working-directory: create-disk-image


    env:
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
      BUILD_KEYPAIR_PRIVATE_KEY: ${{ secrets.BUILD_KEYPAIR_PRIVATE_KEY }}

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.READ_RESULTES_REPOS_APP_ID }}
          private-key: ${{ secrets.READ_RESULTES_REPOS_APP_KEY }}
          repositories: |
            runner
            pydantic-models
            openstack-utils
            jsonrpc

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: 'true'
          lfs: true

      - name: Create disk image file
        run: |
          New-Vhd -Path image.vhdx -SizeBytes 2GB
          
      - name: Mount disk image file
        run: |
          Mount-DiskImage -ImagePath $PWD\image.vhdx

      - name: Show disks
        run: |
          Get-Disk

      - name: Initialize disk
        run: |
          Initialize-Disk -Number 2

      - name: Create new partition
        run: |
           New-Partition -DiskNumber 2 -UseMaximumSize

      - name: Set drive letter
        run: |
          Set-Partition -DiskNumber 2 -PartitionNumber 2 -NewDriveLetter E

      - name: Format volume
        run: |
          Format-Volume -DriveLetter E

      - name: Extract TRNSYS
        run: |
          Expand-Archive -Path .\TRNSYS18_resultes.zip

      - name: Move TRNSYS to 'E:'
        run: |
          mv .\TRNSYS18_resultes\TRNSYS18 E:\

      - name: Download NSSM
        run: |
            $ProgressPreference="SilentlyContinue"
            Invoke-WebRequest -Uri https://nssm.cc/release/nssm-2.24.zip -OutFile nssm-2.24.zip
            $ProgressPreference="Continue"

      - name: Unzip NSSM
        run: |
          Expand-Archive -Path nssm-2.24.zip

      - name: Move NSSM folder to 'E:'
        run: |
          mv nssm-2.24 E:\

      - name: Enable long paths
        run: |
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Download stand-alone python
        run: |
          $ProgressPreference="SilentlyContinue"
          Invoke-WebRequest `
            https://github.com/astral-sh/python-build-standalone/releases/download/20250808/cpython-3.12.11+20250808-x86_64-pc-windows-msvc-install_only.tar.gz `
            -OutFile python.tar.gz
          $ProgressPreference="Continue"

      - name: Extract python
        run: |
          tar -xz -f python.tar.gz

      - name: Move python folder to 'E:'
        run: |
          mv python E:\

      - name: Copy source files
        run: |
          cp -R ..\requirements-3.13 E:
          cp -R ..\src E:
          cp -R ..\pydantic-models E:
          cp -R ..\openstack-utils E:
          cp -R ..\jsonrpc E:
          cp -R ..\config E:

      - name: List contents of 'E:'
        run: |
          ls E:\

      - name: Install requirements
        working-directory: E:\
        run: |
          .\python\python.exe -m pip install --upgrade wheel pip uv
          .\python\python.exe -m uv pip install -r .\requirements-3.13\run.txt

      - name: Unmount disk image file
        run: |
          Dismount-DiskImage -ImagePath $PWD\image.vhdx

      - name: Create venv
        run: |
            py -3.12 -m venv venv
            .\venv\Scripts\python.exe -m pip install --upgrade wheel pip uv
            .\venv\Scripts\python.exe -m uv pip sync .\requirements\build.txt


      - name: Upload image
        run: |
          .\scripts\os.ps1 image create --file image.vhdx --disk-format qcow2 runner-disk-image